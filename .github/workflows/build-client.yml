# Builds the UO Smallz client and publishes it as a versioned release.
#
# TazUO (a ClassicUO fork) at the pinned commit (patches/client/TAZUO_COMMIT)
# with patches/client/*.patch applied in name order, built the way TazUO
# builds its releases (dotnet publish of ClassicUO.Client -> TazUO.exe).
# Mirrors uo-offline-dev's .github/workflows/build-client.yml.
#
# The release tag is "v" + CLIENT_VERSION (v2, v3, ...). It is marked latest,
# which is what the launcher (update-check.ps1) and install.ps1 read:
#   UOSmallz-Client-win-x64.zip, UOSmallz-Client-linux-x64.zip,
#   UOSmallz-Client-win-x64.files.json, UOSmallz-Client-linux-x64.files.json
#     (every file of the zip with size and SHA-256: the launcher fetches only
#     the changed ones), UOSmallz-Installer-win.zip (installer/ + notices/ +
#     README; refreshed by installer.yml when only those change), SHA256SUMS.txt
#
# To ship a new client: change patches/client and bump CLIENT_VERSION in the
# same push to main (or run it from the Actions tab). A tag that already
# exists is never overwritten: the run fails and asks for a bump, so a
# player's installed version always names exactly one build.
name: Build UO Smallz client

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "CLIENT_VERSION"
      - ".github/workflows/build-client.yml"

# Read-only by default; only the release job may write (it publishes).
permissions:
  contents: read

concurrency:
  group: build-client
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      tazuo: ${{ steps.v.outputs.tazuo }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Release tag from CLIENT_VERSION
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(tr -d '[:space:]' < CLIENT_VERSION)"
          if ! [[ "$ver" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::CLIENT_VERSION must be a number like 2 or 2.1 (got '$ver')"; exit 1
          fi
          tag="v$ver"
          # A bare tag (no release) would make the release action publish on
          # whatever commit that tag points at: refuse both.
          if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            echo "::error::Tag $tag already exists. Bump CLIENT_VERSION to publish a new client."; exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump CLIENT_VERSION to publish a new client."; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tazuo=$(tr -d '[:space:]' < patches/client/TAZUO_COMMIT)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          - os: ubuntu-22.04
            target: linux-x64
    steps:
      # Windows runners check out with CRLF; the patches are LF.
      - name: Keep line endings as they are
        shell: bash
        run: git config --global core.autocrlf false

      - name: This repo (the patches)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: smallz

      - name: TazUO source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: PlayTazUO/TazUO
          ref: ${{ needs.version.outputs.tazuo }}
          path: cuo
          submodules: recursive

      - name: Apply the UO Smallz patches
        shell: bash
        run: |
          cd cuo
          for p in ../smallz/patches/client/*.patch; do
            echo "Applying $p"
            if ! git apply --whitespace=nowarn "$p"; then
              echo "Plain apply failed; retrying with line endings ignored"
              git apply --verbose --ignore-whitespace --whitespace=nowarn "$p"
            fi
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Build the client (TazUO.exe)
        shell: bash
        working-directory: cuo
        run: dotnet publish src/ClassicUO.Client/ClassicUO.Client.csproj -c Release -r ${{ matrix.target }} -o dist

      - name: Notices (license, notice, the full change patch)
        shell: bash
        run: |
          mkdir -p cuo/dist/notices
          cp smallz/notices/LICENSE-TazUO-ClassicUO.txt smallz/notices/NOTICE.txt cuo/dist/notices/
          cat smallz/patches/client/*.patch > cuo/dist/notices/uosmallz-tazuo-changes.patch
          # the launcher rides along: update-check.ps1 copies these over itself after an update
          mkdir -p cuo/dist/launcher
          cp smallz/installer/update-check.ps1 smallz/installer/launch.vbs cuo/dist/launcher/

      # Every file of the zip with its size and SHA-256: the launcher compares it
      # with the installed client and fetches only what changed (update-check.ps1,
      # Invoke-ClientDelta). Paths relative, with "/".
      - name: File list
        shell: pwsh
        run: |
          $root = (Resolve-Path cuo/dist).Path
          $files = Get-ChildItem -LiteralPath $root -Recurse -File | Sort-Object FullName | ForEach-Object {
            [ordered]@{
              path   = $_.FullName.Substring($root.Length + 1).Replace('\', '/')
              size   = $_.Length
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            }
          }
          $list = [ordered]@{ tag = "${{ needs.version.outputs.tag }}"; files = @($files) }
          $list | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath "UOSmallz-Client-${{ matrix.target }}.files.json" -Encoding utf8NoBOM
          "$(@($files).Count) files listed"

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path cuo/dist/* -DestinationPath "UOSmallz-Client-${{ matrix.target }}.zip" -Force

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-${{ matrix.target }}
          path: |
            UOSmallz-Client-${{ matrix.target }}.zip
            UOSmallz-Client-${{ matrix.target }}.files.json
          retention-days: 3

  release:
    needs: [version, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: smallz

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: client-*
          merge-multiple: true
          path: out

      - name: Installer package and SHA256SUMS.txt
        shell: bash
        run: |
          mkdir -p pkg/UOSmallz-Installer
          cp -r smallz/installer/. pkg/UOSmallz-Installer/
          cp -r smallz/notices pkg/UOSmallz-Installer/notices
          cat smallz/patches/client/*.patch > pkg/UOSmallz-Installer/notices/uosmallz-tazuo-changes.patch
          cp smallz/README.md pkg/UOSmallz-Installer/README.txt
          (cd pkg && zip -qr ../out/UOSmallz-Installer-win.zip UOSmallz-Installer)
          cd out
          sha256sum UOSmallz-Client-win-x64.zip UOSmallz-Client-linux-x64.zip UOSmallz-Installer-win.zip \
            UOSmallz-Client-win-x64.files.json UOSmallz-Client-linux-x64.files.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish ${{ needs.version.outputs.tag }} (latest)
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.version.outputs.tag }}
          commit: ${{ github.sha }}
          name: "UO Smallz client ${{ needs.version.outputs.tag }}"
          body: |
            UO Smallz player client ${{ needs.version.outputs.tag }}: TazUO ${{ needs.version.outputs.tazuo }} with the UO Smallz patches (patches/client; full patch in notices/).

            Already installed? Start UO Smallz from its shortcut and choose Update Now. New player: download UOSmallz-Installer-win.zip, unzip, run install.bat.
          artifacts: "out/UOSmallz-Client-win-x64.zip,out/UOSmallz-Client-linux-x64.zip,out/UOSmallz-Installer-win.zip,out/UOSmallz-Client-win-x64.files.json,out/UOSmallz-Client-linux-x64.files.json,out/SHA256SUMS.txt"
          allowUpdates: false
          makeLatest: "true"
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
